<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/thomas-lowry/figma-plugin-ds/dist/figma-plugin-ds.css">

<style>
  body { padding: 2em; }
  div { margin: 0em; }
  input { display: block; }

  #table-container { max-height: 350px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, tr:nth-last-child(1) { background-color: #f2f2f2; font-weight: bold; padding: 8px; text-align: left; font-size: 11px; }
  td { border: 1px solid #ddd; padding: 8px; font-size: 11px; }
  tr:nth-child(even) { background-color: #f9f9f9; }
  tr:hover { background-color: #f5f5f5; }

  .row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  .row label { font-size: 11px; white-space: nowrap; }
  .row select, .row input[type="number"], .row input[type="text"] { display: inline-block; min-width: 120px; }
  .row input[type="checkbox"] { transform: scale(1.1); margin-top: 2px; }

  .disabled-ctrl { opacity: .5; pointer-events: none; }

  #busyText { font-size: 11px; color: #666; display: none; margin: 10px 0 6px; }
  #busyBarWrap { height: 6px; background: #eee; border-radius: 999px; overflow: hidden; display: none; }
  #busyBar { height: 100%; width: 0%; background: #18a0fb; transition: width .2s ease; }

  .btn-container { display: flex; justify-content: center; gap: 12px; margin-top: 20px; }
</style>

<h1>Compress & Export</h1>

<!-- FORMAT + OPTIONS -->
<div class="row">
  <label for="format" class="type--small">Format:</label>
  <select id="format">
    <option value="JPEG">JPEG (MozJPEG)</option>
    <option value="WEBP">WebP (lossy / lossless)</option>
    <option value="PNG">PNG (lossless / quantized)</option>
    <option value="PNG-lossless-oxipng">PNG (lossless optimize only)</option>
  </select>

  <label for="lossless" class="type--small">Lossless:</label>
  <input type="checkbox" id="lossless" />
</div>
<div class="row">
  <label for="chroma" class="type--small">JPEG Chroma:</label>
  <select id="chroma" style="min-width: 50px;">
    <option value="420" selected>4:2:0</option>
    <option value="444">4:4:4</option>
  </select>

  <label for="quantColors" class="type--small">PNG Quant Colors:</label>
  <input type="number" id="quantColors" min="0" max="256" step="1" value="0" style="min-width:60px" />

  <label for="oxipng" class="type--small">Oxipng:</label>
  <input type="checkbox" id="oxipng" checked />
</div>
<div class="row">
  <label for="jpegBg" class="type--small">JPEG background:</label>
  <input type="color" id="jpegBg" value="#ffffff" style="min-width:40px" />
  <span id="alphaNote" class="type--small" style="display:none; color:#666">Transparent areas will be filled with the background colour.</span>
</div>

<!-- QUALITY -->
<label for="quality" class="type--small" style="margin-top:8px">Compression (Quality 1–100):</label>
<input type="number" id="quality" min="1" max="100" step="0.5" value="80" style="display:inline-block">
<input type="range" min="1" max="100" class="slider" step="0.5" id="myRange" value="80" style="accent-color: rgb(0, 85, 35);">

<!-- Busy / progress -->
<div id="busyText">Compressing…</div>
<div id="busyBarWrap"><div id="busyBar"></div></div>

<div id="table-container"></div>
<div id="total-container"></div>

<div class="btn-container">
  <button class="button button--primary" id="reload">Reload</button>
  <button class="button button--primary" id="calculate" style="display: none;">Calculate</button>
  <button class="button button--primary" id="export">Export</button>
</div>

<div class="row" style="margin-top:10px">
  <label for="zipName" class="type--small">ZIP name:</label>
  <input type="text" id="zipName" value="images.zip" style="width:200px" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="module">
  import { decode as decodeJpeg, encode as encodeJpeg } from "https://unpkg.com/@jsquash/jpeg@1?module";
  import { decode as decodePng,  encode as encodePng  } from "https://unpkg.com/@jsquash/png@3?module";
  import { encode as encodeWebp }                      from "https://unpkg.com/@jsquash/webp@1?module";
  import { optimise as oxipng }                        from "https://unpkg.com/@jsquash/oxipng@2?module";
  import * as IQ                                       from "https://cdn.jsdelivr.net/npm/image-q@4/+esm";

  // Elements
  const qInput = document.getElementById('quality');
  const rInput = document.getElementById('myRange');
  const fmtEl = document.getElementById('format');
  const losslessEl = document.getElementById('lossless');
  const chromaEl = document.getElementById('chroma');
  const quantColorsEl = document.getElementById('quantColors');
  const oxipngEl = document.getElementById('oxipng');
  const jpegBgEl = document.getElementById('jpegBg');
  const alphaNoteEl = document.getElementById('alphaNote');
  const zipNameEl = document.getElementById('zipName');

  const busyText = document.getElementById('busyText');
  const busyBarWrap = document.getElementById('busyBarWrap');
  const busyBar = document.getElementById('busyBar');

  // Defaults used until the user changes something; after that the plugin remembers their choices
  const DEFAULTS = {
    format: 'JPEG',
    quality: 80,
    lossless: false,
    chroma: '420',
    quantColors: 0,
    oxipng: true,
    jpegBackground: '#ffffff',
    zipName: 'images.zip',
  };
  const FORMATS = ['JPEG', 'WEBP', 'PNG', 'PNG-lossless-oxipng'];

  // Apply settings saved by code.ts (figma.clientStorage). Unknown or bad values fall back to defaults.
  function applySettings(saved) {
    const s = { ...DEFAULTS, ...(saved && typeof saved === 'object' ? saved : {}) };
    const q = Number(s.quality);
    const quality = Number.isFinite(q) && q >= 1 && q <= 100 ? q : DEFAULTS.quality;
    fmtEl.value = FORMATS.includes(s.format) ? s.format : DEFAULTS.format;
    qInput.value = String(quality);
    rInput.value = String(quality);
    losslessEl.checked = !!s.lossless;
    chromaEl.value = s.chroma === '444' ? '444' : '420';
    const qc = Number(s.quantColors);
    quantColorsEl.value = String(Number.isFinite(qc) && qc >= 0 && qc <= 256 ? Math.round(qc) : 0);
    oxipngEl.checked = s.oxipng !== false;
    jpegBgEl.value = /^#[0-9a-f]{6}$/i.test(s.jpegBackground) ? s.jpegBackground : DEFAULTS.jpegBackground;
    zipNameEl.value = typeof s.zipName === 'string' && s.zipName ? s.zipName : DEFAULTS.zipName;
    updateControlVisibility();
  }

  let saveTimer = null;
  function saveSettings() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const settings = {
        format: fmtEl.value,
        quality: Number(qInput.value || DEFAULTS.quality),
        lossless: losslessEl.checked,
        chroma: chromaEl.value,
        quantColors: Number(quantColorsEl.value || 0),
        oxipng: oxipngEl.checked,
        jpegBackground: jpegBgEl.value,
        zipName: zipNameEl.value,
      };
      parent.postMessage({ pluginMessage: { type: 'save-settings', settings } }, '*');
    }, 300);
  }

  // Buttons
  document.getElementById('reload').onclick = () => parent.postMessage({ pluginMessage: '' }, '*');
  document.getElementById('calculate').onclick = () => triggerAutoCalcNow();
  document.getElementById('export').onclick = () => {
    const arr = compressedArray
      ? compressedArray
      : originalArray.map(([n, s, b, suffix]) => [n, s, b, b.type.includes('png') ? 'png' : b.type.includes('webp') ? 'webp' : 'jpg', suffix]);
    handleBlobs(arr);
  };

  // Slider ↔ number sync (+ auto-calc debounce)
  rInput.oninput = () => { qInput.value = rInput.value; saveSettings(); scheduleAutoCalc(); };
  qInput.oninput = () => { rInput.value = qInput.value; saveSettings(); scheduleAutoCalc(); };
  jpegBgEl.addEventListener('input', () => { saveSettings(); scheduleAutoCalc(); });
  zipNameEl.addEventListener('input', () => saveSettings());
  for (const el of [fmtEl, losslessEl, quantColorsEl, oxipngEl, chromaEl]) {
    el.addEventListener(el === quantColorsEl ? 'input' : 'change', () => saveSettings());
  }

  // Format/option listeners → auto-calc
  fmtEl.addEventListener('change', () => { updateControlVisibility(); scheduleAutoCalc(); });
  losslessEl.addEventListener('change', () => {
    if (fmtEl.value === 'WEBP' && losslessEl.checked) { qInput.value = rInput.value = '100'; }
    updateControlVisibility(); scheduleAutoCalc();
  });
  quantColorsEl.addEventListener('input', () => { updateControlVisibility(); scheduleAutoCalc(); });
  oxipngEl.addEventListener('change', () => { updateControlVisibility(); scheduleAutoCalc(); });
  chromaEl.addEventListener('change', () => { scheduleAutoCalc(); });

  // State
  let originalArray = [];      // [[name, scale, Blob, suffix], ...]
  let compressedArray = null;  // [[name, scale, Blob, ext, suffix], ...]
  let anyTransparent = false;  // true when a source image has alpha < 255 somewhere
  let autoCalcTimer = null;
  let currentRunId = 0;

  // ---- Byte helpers ----
  function toArrayBuffer(input) {
    if (input instanceof ArrayBuffer) return input;
    if (ArrayBuffer.isView(input))
      return input.buffer.slice(input.byteOffset, input.byteOffset + input.byteLength);
    throw new TypeError('Expected ArrayBuffer or TypedArray');
  }
  function toUint8(input) {
    if (input instanceof Uint8Array) return input;
    if (input instanceof ArrayBuffer) return new Uint8Array(input);
    if (ArrayBuffer.isView(input)) return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
    throw new TypeError('Expected ArrayBuffer or TypedArray');
  }
  function sniffFormat(u8) {
    if (u8.length >= 8 && u8[0] === 0x89 && u8[1] === 0x50) return 'PNG';
    if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xD8) return 'JPG';
    if (u8.length >= 12 && u8[0] === 0x52 && u8[1] === 0x49 && u8[8] === 0x57 && u8[9] === 0x45) return 'WEBP';
    return 'JPG';
  }
  function bytesToBlob(anyBytes) {
    const u8 = toUint8(anyBytes);
    const fmt = sniffFormat(u8);
    const mime = fmt === 'PNG' ? 'image/png' : fmt === 'WEBP' ? 'image/webp' : 'image/jpeg';
    return new Blob([toArrayBuffer(u8)], { type: mime });
  }

  async function bytesToImageData(anyBytes, mime = 'image/png') {
    const blob = new Blob([toArrayBuffer(anyBytes)], { type: mime });
    const bmp = await createImageBitmap(blob);
    const oc = new OffscreenCanvas(bmp.width, bmp.height);
    const ctx = oc.getContext('2d');
    ctx.drawImage(bmp, 0, 0);
    return ctx.getImageData(0, 0, bmp.width, bmp.height);
  }
  async function ensureImageDataFromBytes(anyBytes) {
    const u8 = toUint8(anyBytes);
    const fmt = sniffFormat(u8);
    try {
      if (fmt === 'PNG') {
        const imgd = await decodePng(toArrayBuffer(u8));
        if (imgd && imgd.data) return imgd;
      } else {
        const imgd = await decodeJpeg(toArrayBuffer(u8));
        if (imgd && imgd.data) return imgd;
      }
    } catch (_) {}
    const mime = fmt === 'PNG' ? 'image/png' : 'image/jpeg';
    return bytesToImageData(u8, mime);
  }

  async function quantizeImageData(imgData, colors = 128) {
    const { width, height, data } = imgData;
    const pc = IQ.utils.PointContainer.fromUint8Array(data, width, height);
    const palette = await IQ.buildPalette([pc], { colors: Math.max(2, Math.min(256, colors)) });
    const out = await IQ.applyPalette(pc, palette, { imageQuantization: "floyd-steinberg" });
    const outData = out.toUint8Array();
    return new ImageData(new Uint8ClampedArray(outData), width, height);
  }

  // Composite RGBA pixels onto a solid colour so JPEG (no alpha channel) doesn't turn transparency black.
  function flattenAlpha(imgData, hex) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4) {
      const a = d[i + 3];
      if (a === 255) continue;
      const t = a / 255;
      d[i]     = Math.round(d[i]     * t + r * (1 - t));
      d[i + 1] = Math.round(d[i + 1] * t + g * (1 - t));
      d[i + 2] = Math.round(d[i + 2] * t + b * (1 - t));
      d[i + 3] = 255;
    }
    return imgData;
  }
  function hasAlpha(imgData) {
    const d = imgData.data;
    for (let i = 3; i < d.length; i += 4) if (d[i] !== 255) return true;
    return false;
  }

  function currentSettings() {
    return {
      jpegBackground: jpegBgEl.value,
      targetFormat: fmtEl.value,
      quality: Number(qInput.value || 82),
      chroma: chromaEl.value,
      lossless: losslessEl.checked,
      lossyColors: Number(quantColorsEl.value || 0),
      useOxipng: oxipngEl.checked,
    };
  }

  // Enable/disable controls where applicable
  function setCtrlEnabled(ctrl, enabled) {
    ctrl.disabled = !enabled;
    const label = ctrl.previousElementSibling?.tagName === 'LABEL' ? ctrl.previousElementSibling : null;
    if (enabled) { ctrl.classList.remove('disabled-ctrl'); label && label.classList.remove('disabled-ctrl'); }
    else { ctrl.classList.add('disabled-ctrl'); label && label.classList.add('disabled-ctrl'); }
  }
  function updateControlVisibility() {
    const fmt = fmtEl.value;
    const isJPEG   = fmt === 'JPEG';
    const isWEBP   = fmt === 'WEBP';
    const isPNG    = fmt === 'PNG';
    const isPNGOpt = fmt === 'PNG-lossless-oxipng';

    const wantLossless = losslessEl.checked;
    const qualityRelevant = (isJPEG) || (isWEBP && !wantLossless);

    setCtrlEnabled(qInput, qualityRelevant);
    setCtrlEnabled(rInput, qualityRelevant);
    setCtrlEnabled(chromaEl, isJPEG);
    setCtrlEnabled(jpegBgEl, isJPEG);
    alphaNoteEl.style.display = isJPEG && anyTransparent ? 'inline' : 'none';
    setCtrlEnabled(losslessEl, isWEBP);
    setCtrlEnabled(quantColorsEl, isPNG);
    setCtrlEnabled(oxipngEl, isPNG || isPNGOpt);

    if (isPNGOpt) {
      setCtrlEnabled(qInput, false);
      setCtrlEnabled(rInput, false);
      setCtrlEnabled(chromaEl, false);
      setCtrlEnabled(jpegBgEl, false);
      setCtrlEnabled(losslessEl, false);
      setCtrlEnabled(quantColorsEl, false);
      setCtrlEnabled(oxipngEl, true);
    }
  }
  updateControlVisibility();

  // ---- Compression (sequential, no pool) ----
  async function compressOne(anyBytes, options) {
    const { targetFormat, quality, chroma, lossless, lossyColors, useOxipng, jpegBackground } = options;
    const u8src = toUint8(anyBytes);

    if (targetFormat === 'PNG-lossless-oxipng') {
      const outAny = await oxipng(u8src, { level: 3, interlace: false, strip: "all" });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/png' }), ext: 'png' };
    }

    let imgData = await ensureImageDataFromBytes(u8src);
    if (hasAlpha(imgData)) anyTransparent = true;

    if (targetFormat === 'JPEG') {
      flattenAlpha(imgData, jpegBackground);
      // mozjpeg: chroma_subsample 1 = 4:4:4, 2 = 4:2:0; auto_subsample must be off for the choice to apply
      const outAny = await encodeJpeg(imgData, {
        quality: Math.round(quality),
        auto_subsample: false,
        chroma_subsample: chroma === '444' ? 1 : 2,
      });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/jpeg' }), ext: 'jpg' };
    }
    if (targetFormat === 'WEBP') {
      const outAny = await encodeWebp(imgData, { quality: Math.round(quality), lossless: lossless ? 1 : 0 });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/webp' }), ext: 'webp' };
    }
    if (targetFormat === 'PNG') {
      if (lossyColors > 0) imgData = await quantizeImageData(imgData, lossyColors);
      let outAny = await encodePng(imgData);
      if (useOxipng) outAny = await oxipng(toUint8(outAny), { level: 3, interlace: false, strip: "all" });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/png' }), ext: 'png' };
    }
    throw new Error('Unsupported format');
  }

  async function compressDataWASM(arrayBlob, onProgress) {
    const options = currentSettings();
    const total = arrayBlob.length;
    const out = new Array(total);
    for (let i = 0; i < total; i++) {
      const [name, scale, blob, suffix] = arrayBlob[i];
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const { blob: outBlob, ext } = await compressOne(bytes, options);
      out[i] = [name, scale, outBlob, ext, suffix];
      if (onProgress) onProgress(i + 1, total);
    }
    return out;
  }

  // ---- Messaging / table / zip ----
  window.onmessage = async (event) => {
    const arrayData = event.data.pluginMessage;
    if (arrayData === undefined || arrayData === null) return;

    // Saved settings from code.ts (sent once, before the first selection)
    if (!Array.isArray(arrayData) && arrayData.type === 'init') {
      applySettings(arrayData.settings);
      return;
    }

    // Empty selection → clear
    if (Array.isArray(arrayData) && arrayData.length === 0) {
      originalArray = [];
      compressedArray = null;
      updateTable([]);
      return;
    }

    // Build blobs from incoming bytes
    const arrayBlob = [];
    for (const data of arrayData) {
      arrayBlob.push([data[0], data[1], bytesToBlob(data[2]), data[3] || '']);
    }

    // New selection: keep the user's settings, stop pending timers
    originalArray = arrayBlob;
    compressedArray = null;
    anyTransparent = false;
    if (autoCalcTimer) { clearTimeout(autoCalcTimer); autoCalcTimer = null; }
    updateControlVisibility();

    // Show originals, then compress with the current settings
    updateTable(arrayBlob);
    triggerAutoCalcNow();
  };

  function extForFormat(fmt) {
    return fmt === 'JPEG' ? 'jpg' : fmt === 'WEBP' ? 'webp' : 'png';
  }

  // Give every file a unique name: "Image.jpg", "Image-2.jpg", "Image-3.jpg".
  // Compared case-insensitively because macOS and Windows treat "image.jpg" and "Image.jpg" as the same file.
  function uniqueFileNames(entries) {
    const used = new Set();
    return entries.map(({ base, ext }) => {
      let candidate = `${base}.${ext}`;
      for (let n = 2; used.has(candidate.toLowerCase()); n++) candidate = `${base}-${n}.${ext}`;
      used.add(candidate.toLowerCase());
      return candidate;
    });
  }
  function updateTable(blobsArray) {
    // Rows: [name, scale, Blob, ext?, suffix]; file names are worked out in selection order (same as the ZIP)
    const ext = extForFormat(fmtEl.value);
    const names = uniqueFileNames(blobsArray.map((r) => ({
      base: sanitizeName(r[0]) + sanitizeName((r.length === 5 ? r[4] : r[3]) || ''),
      ext: r.length === 5 ? r[3] : ext,
    })));
    const rows = blobsArray.map((r, i) => [names[i], r[1], r[2]]);
    const sorted = rows.sort((a, b) => naturalSort(a[0], b[0]));
    const container = document.getElementById('table-container');
    container.innerHTML = '';
    const table = document.createElement('table');
    const header = document.createElement('tr');
    ['File Name', 'Scale', 'File Size'].forEach((t) => {
      const th = document.createElement('th'); th.textContent = t; header.appendChild(th);
    });
    table.appendChild(header);
    let total = 0;
    for (const [name, scale, blob] of sorted) {
      const row = document.createElement('tr');
      const nameCell = document.createElement('td');
      nameCell.textContent = shortenString(name);
      nameCell.title = name;
      const scaleCell = document.createElement('td');
      scaleCell.textContent = String(scale);
      const sizeCell = document.createElement('td');
      sizeCell.textContent = formatBytes(blob.size);
      row.append(nameCell, scaleCell, sizeCell);
      table.appendChild(row);
      total += blob.size;
    }
    const totalRow = document.createElement('tr');
    totalRow.innerHTML = `<td>Total</td><td></td><td>${formatBytes(total)}</td>`;
    table.appendChild(totalRow);
    container.appendChild(table);
  }

  function handleBlobs(inputBlobs) {
    const zip = new JSZip();
    const names = uniqueFileNames(inputBlobs.map(([name, , , ext, suffix]) => ({
      base: sanitizeName(name) + sanitizeName(suffix || ''),
      ext,
    })));
    inputBlobs.forEach(([, , blob], i) => zip.file(names[i], blob, { binary: true }));
    zip.generateAsync({ type: 'blob' }).then((content) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = sanitizeName(document.getElementById('zipName').value || 'images.zip');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    });
  }

  function naturalSort(a, b) { return new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' }).compare(a, b); }
  function shortenString(str) { const max = 50; return str.length <= max ? str : (str.slice(0,24) + '...' + str.slice(-23)); }
  function formatBytes(bytes) { if (bytes < 1024) return bytes + ' B'; if (bytes < 1048576) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1048576).toFixed(1)+' MB'; }
  function sanitizeName(s) { return String(s).replace(/[\/\\?%*:|"<>]/g, '_'); }

  // ---- Auto-calc debounce + minimal busy UI ----
  function disableAllControls(disabled) {
    const controls = [fmtEl, losslessEl, chromaEl, quantColorsEl, oxipngEl, qInput, rInput,
      document.getElementById('reload'), document.getElementById('calculate'), document.getElementById('export')
    ];
    for (const c of controls) c.disabled = !!disabled;
  }
  function showBusy(show) {
    busyText.style.display = show ? 'block' : 'none';
    busyBarWrap.style.display = show ? 'block' : 'none';
    if (!show) busyBar.style.width = '0%';
  }
  function setProgress(done, total) {
    const pct = total ? Math.round((done / total) * 100) : 0;
    busyBar.style.width = pct + '%';
    busyText.textContent = total ? `Compressing… ${done}/${total}` : 'Compressing…';
  }

  function scheduleAutoCalc() {
    if (autoCalcTimer) clearTimeout(autoCalcTimer);
    autoCalcTimer = setTimeout(() => triggerAutoCalcNow(), 1500);
  }

  async function triggerAutoCalcNow() {
    if (!originalArray || originalArray.length === 0) return;
    const myRun = ++currentRunId;

    showBusy(true);
    disableAllControls(true);
    setProgress(0, originalArray.length);

    try {
      const newBlobs = await compressDataWASM(originalArray, (done, total) => {
        if (myRun !== currentRunId) return;
        setProgress(done, total);
      });
      if (myRun !== currentRunId) return;
      updateTable(newBlobs);
      compressedArray = newBlobs;
      updateControlVisibility();
    } catch (err) {
      console.error('Error compressing blobs:', err);
    } finally {
      if (myRun === currentRunId) {
        showBusy(false);
        disableAllControls(false);
      }
    }
  }

  // Initial applicability
  updateControlVisibility();
</script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/thomas-lowry/figma-plugin-ds/dist/figma-plugin-ds.css">

<style>
  body { padding: 2em; }
  div { margin: 0em; }
  input { display: block; }

  #table-container { max-height: 350px; overflow-y: auto; }
  table { border-collapse: collapse; width: 100%; }

  th, tr:nth-last-child(1) {
    background-color: #f2f2f2;
    font-weight: bold;
    padding: 8px;
    text-align: left;
    font-size: 11px;
  }

  td {
    border: 1px solid #ddd;
    padding: 8px;
    font-size: 11px;
  }

  tr:nth-child(even) { background-color: #f9f9f9; }
  tr:hover { background-color: #f5f5f5; }

  .row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  .row label { font-size: 11px; white-space: nowrap; }
  .row select, .row input[type="number"], .row input[type="text"] {
    display: inline-block; min-width: 120px;
  }
  .row input[type="checkbox"] { transform: scale(1.1); margin-top: 2px; }

  /* Visual disabled state for controls + labels */
  .disabled-ctrl { opacity: .5; pointer-events: none; }
</style>

<h1>Compress & Export</h1>

<!-- FORMAT + OPTIONS -->
<div class="row">
  <label for="format" class="type--small">Format:</label>
  <select id="format">
    <option value="JPEG">JPEG (MozJPEG)</option>
    <option value="WEBP">WebP (lossy / lossless)</option>
    <option value="PNG">PNG (lossless / quantized)</option>
    <option value="PNG-lossless-oxipng">PNG (lossless optimize only)</option>
  </select>

  <label for="lossless" class="type--small">Lossless:</label>
  <input type="checkbox" id="lossless" />

  <label for="chroma" class="type--small">JPEG Chroma:</label>
  <select id="chroma">
    <option value="420" selected>4:2:0</option>
    <option value="444">4:4:4</option>
  </select>

  <label for="quantColors" class="type--small">PNG Quant Colors:</label>
  <input type="number" id="quantColors" min="0" max="256" step="1" value="0" style="width:80px" />

  <label for="oxipng" class="type--small">Oxipng:</label>
  <input type="checkbox" id="oxipng" checked />
</div>

<!-- QUALITY -->
<label for="quality" class="type--small" style="margin-top:8px">Compression (Quality 1–100):</label>
<input type="number" id="quality" min="1" max="100" step="0.5" value="100" style="display:inline-block">
<input type="range" min="1" max="100" class="slider" step="0.5" id="myRange" value="100" style="accent-color: rgb(0, 85, 35);">

<div id="table-container"></div>
<div id="total-container"></div>

<div style="text-align:center; margin-top:10px;">
  <button class="button button--primary" id="reload">Reload</button>
  <button class="button button--primary" id="calculate">Calculate</button>
  <button class="button button--primary" id="export">Export</button>
</div>

<div class="row" style="margin-top:10px">
  <label for="zipName" class="type--small">ZIP name:</label>
  <input type="text" id="zipName" value="images.zip" style="width:200px" />
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<script type="module">
  import { decode as decodeJpeg, encode as encodeJpeg } from "https://unpkg.com/@jsquash/jpeg@1?module";
  import { decode as decodePng,  encode as encodePng  } from "https://unpkg.com/@jsquash/png@3?module";
  import { encode as encodeWebp }                      from "https://unpkg.com/@jsquash/webp@1?module";
  import { optimise as oxipng }                        from "https://unpkg.com/@jsquash/oxipng@2?module";
  import * as IQ                                       from "https://cdn.jsdelivr.net/npm/image-q@4/+esm";

  const qInput = document.getElementById('quality');
  const rInput = document.getElementById('myRange');
  const fmtEl = document.getElementById('format');
  const losslessEl = document.getElementById('lossless');
  const chromaEl = document.getElementById('chroma');
  const quantColorsEl = document.getElementById('quantColors');
  const oxipngEl = document.getElementById('oxipng');

  document.getElementById('reload').onclick = () => parent.postMessage({ pluginMessage: '' }, '*');
  rInput.oninput = () => (qInput.value = rInput.value);
  qInput.oninput = () => (rInput.value = qInput.value);

  let originalArray = [];
  let compressedArray = null;

  // ---------- Byte helpers (robust to ArrayBuffer/TypedArray) ----------
  function toArrayBuffer(input) {
    if (input instanceof ArrayBuffer) return input;
    if (ArrayBuffer.isView(input))
      return input.buffer.slice(input.byteOffset, input.byteOffset + input.byteLength);
    throw new TypeError('Expected ArrayBuffer or TypedArray');
  }
  function toUint8(input) {
    if (input instanceof Uint8Array) return input;
    if (input instanceof ArrayBuffer) return new Uint8Array(input);
    if (ArrayBuffer.isView(input)) return new Uint8Array(input.buffer, input.byteOffset, input.byteLength);
    throw new TypeError('Expected ArrayBuffer or TypedArray');
  }

  function sniffFormat(u8) {
    if (u8.length >= 8 && u8[0] === 0x89 && u8[1] === 0x50) return 'PNG';
    if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xD8) return 'JPG';
    if (u8.length >= 12 && u8[0] === 0x52 && u8[1] === 0x49 && u8[8] === 0x57 && u8[9] === 0x45) return 'WEBP';
    return 'JPG';
  }

  function bytesToBlob(anyBytes) {
    const u8 = toUint8(anyBytes);
    const fmt = sniffFormat(u8);
    const mime = fmt === 'PNG' ? 'image/png' : fmt === 'WEBP' ? 'image/webp' : 'image/jpeg';
    return new Blob([toArrayBuffer(u8)], { type: mime });
  }

  async function bytesToImageData(anyBytes, mime = 'image/png') {
    const blob = new Blob([toArrayBuffer(anyBytes)], { type: mime });
    const bmp = await createImageBitmap(blob);
    const oc = new OffscreenCanvas(bmp.width, bmp.height);
    const ctx = oc.getContext('2d');
    ctx.drawImage(bmp, 0, 0);
    return ctx.getImageData(0, 0, bmp.width, bmp.height);
  }

  async function ensureImageDataFromBytes(anyBytes) {
    const u8 = toUint8(anyBytes);
    const fmt = sniffFormat(u8);
    try {
      if (fmt === 'PNG') {
        const imgd = await decodePng(toArrayBuffer(u8));
        if (imgd && imgd.data) return imgd;
      } else {
        const imgd = await decodeJpeg(toArrayBuffer(u8));
        if (imgd && imgd.data) return imgd;
      }
    } catch (_) {}
    const mime = fmt === 'PNG' ? 'image/png' : 'image/jpeg';
    return bytesToImageData(u8, mime);
  }

  async function quantizeImageData(imgData, colors = 128) {
    const { width, height, data } = imgData;
    const pc = IQ.utils.PointContainer.fromUint8Array(data, width, height);
    const palette = await IQ.buildPalette([pc], { colors: Math.max(2, Math.min(256, colors)) });
    const out = await IQ.applyPalette(pc, palette, { imageQuantization: "floyd-steinberg" });
    const outData = out.toUint8Array();
    return new ImageData(new Uint8ClampedArray(outData), width, height);
  }

  function currentSettings() {
    return {
      targetFormat: fmtEl.value,
      quality: Number(qInput.value || 82),
      chroma: chromaEl.value,
      lossless: losslessEl.checked,
      lossyColors: Number(quantColorsEl.value || 0),
      useOxipng: oxipngEl.checked,
    };
  }

  // ---------- Control enable/disable logic ----------
  function setCtrlEnabled(ctrl, enabled) {
    ctrl.disabled = !enabled;
    const label = ctrl.previousElementSibling?.tagName === 'LABEL' ? ctrl.previousElementSibling : null;
    if (enabled) {
      ctrl.classList.remove('disabled-ctrl');
      label && label.classList.remove('disabled-ctrl');
    } else {
      ctrl.classList.add('disabled-ctrl');
      label && label.classList.add('disabled-ctrl');
    }
  }

  function updateControlVisibility() {
    const fmt = fmtEl.value; // 'JPEG' | 'WEBP' | 'PNG' | 'PNG-lossless-oxipng'
    const isJPEG   = fmt === 'JPEG';
    const isWEBP   = fmt === 'WEBP';
    const isPNG    = fmt === 'PNG';
    const isPNGOpt = fmt === 'PNG-lossless-oxipng';

    const wantLossless = losslessEl.checked;                 // WEBP only
    const qualityRelevant = (isJPEG) || (isWEBP && !wantLossless);

    // Quality relevant for JPEG, and for WebP only when NOT lossless
    setCtrlEnabled(qInput, qualityRelevant);
    setCtrlEnabled(rInput, qualityRelevant);

    // JPEG chroma only for JPEG
    setCtrlEnabled(chromaEl, isJPEG);

    // Lossless toggle: only meaningful for WebP (PNG encode is inherently lossless here)
    setCtrlEnabled(losslessEl, isWEBP);

    // PNG quantization (lossy PNG) only for PNG format
    setCtrlEnabled(quantColorsEl, isPNG);

    // Oxipng for PNG and PNG-lossless-oxipng
    setCtrlEnabled(oxipngEl, isPNG || isPNGOpt);

    // Special case: PNG-lossless-oxipng mode — disable everything else
    if (isPNGOpt) {
      setCtrlEnabled(qInput, false);
      setCtrlEnabled(rInput, false);
      setCtrlEnabled(chromaEl, false);
      setCtrlEnabled(losslessEl, false);
      setCtrlEnabled(quantColorsEl, false);
      setCtrlEnabled(oxipngEl, true);
    }
  }

  // Re-evaluate when relevant controls change
  fmtEl.addEventListener('change', updateControlVisibility);
  losslessEl.addEventListener('change', () => {
    // Optional UX: when WebP becomes lossless, set quality to 100 (ignored anyway)
    if (fmtEl.value === 'WEBP' && losslessEl.checked) {
      qInput.value = rInput.value = '100';
    }
    updateControlVisibility();
  });
  quantColorsEl.addEventListener('input', updateControlVisibility);
  oxipngEl.addEventListener('change', updateControlVisibility);
  chromaEl.addEventListener('change', updateControlVisibility);
  updateControlVisibility();

  // ---------- Compression ----------
  async function compressOne(anyBytes, options) {
    const { targetFormat, quality, chroma, lossless, lossyColors, useOxipng } = options;
    const u8src = toUint8(anyBytes);

    if (targetFormat === 'PNG-lossless-oxipng') {
      const outAny = await oxipng(u8src, { level: 3, interlace: false, strip: "all" });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/png' }), ext: 'png' };
    }

    let imgData = await ensureImageDataFromBytes(u8src);

    if (targetFormat === 'JPEG') {
      const outAny = await encodeJpeg(imgData, { quality: Math.round(quality), chromaSubsampling: chroma });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/jpeg' }), ext: 'jpg' };
    }
    if (targetFormat === 'WEBP') {
      const outAny = await encodeWebp(imgData, { quality: Math.round(quality), lossless: !!lossless });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/webp' }), ext: 'webp' };
    }
    if (targetFormat === 'PNG') {
      if (lossyColors > 0) imgData = await quantizeImageData(imgData, lossyColors);
      let outAny = await encodePng(imgData);
      if (useOxipng) outAny = await oxipng(toUint8(outAny), { level: 3, interlace: false, strip: "all" });
      return { blob: new Blob([toArrayBuffer(outAny)], { type: 'image/png' }), ext: 'png' };
    }
    throw new Error('Unsupported format');
  }

  async function compressDataWASM(arrayBlob) {
    const options = currentSettings();
    const jobs = arrayBlob.map(async ([name, scale, blob]) => {
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const { blob: outBlob, ext } = await compressOne(bytes, options);
      return [name, scale, outBlob, ext];
    });
    return Promise.all(jobs);
  }

  // ---------- Messaging / Table / ZIP ----------
  window.onmessage = async (event) => {
    const arrayData = event.data.pluginMessage;
    if (!arrayData) return;

    const arrayBlob = [];
    if (arrayData.length) {
      for (const data of arrayData) arrayBlob.push([data[0], data[1], bytesToBlob(data[2])]);
    }
    originalArray = arrayBlob;
    compressedArray = null;
    updateTable(arrayBlob);

    document.getElementById('export').onclick = () => {
      const arr = compressedArray
        ? compressedArray
        : originalArray.map(([n, s, b]) => [n, s, b, b.type.includes('png') ? 'png' : b.type.includes('webp') ? 'webp' : 'jpg']);
      handleBlobs(arr);
    };

    document.getElementById('calculate').onclick = () => {
      compressDataWASM(originalArray)
        .then((newBlobs) => {
          updateTable(newBlobs.map(([n, s, b]) => [n, s, b]));
          compressedArray = newBlobs;
        })
        .catch((err) => console.error('Error compressing blobs:', err));
    };
  };

  function updateTable(blobsArray) {
    const sorted = [...blobsArray].sort((a, b) => naturalSort(a[0], b[0]));
    const container = document.getElementById('table-container');
    container.innerHTML = '';
    const table = document.createElement('table');
    const header = document.createElement('tr');
    ['Node Name', 'Scale', 'File Size'].forEach((t) => {
      const th = document.createElement('th');
      th.textContent = t;
      header.appendChild(th);
    });
    table.appendChild(header);
    let total = 0;
    for (const [name, scale, blob] of sorted) {
      const row = document.createElement('tr');
      row.innerHTML = `<td>${shortenString(name)}</td><td>${scale}</td><td>${formatBytes(blob.size)}</td>`;
      table.appendChild(row);
      total += blob.size;
    }
    const totalRow = document.createElement('tr');
    totalRow.innerHTML = `<td>Total</td><td></td><td>${formatBytes(total)}</td>`;
    table.appendChild(totalRow);
    container.appendChild(table);
  }

  function handleBlobs(inputBlobs) {
    const zip = new JSZip();
    for (const [name, , blob, ext] of inputBlobs) {
      zip.file(`${sanitizeName(name)}.${ext}`, blob, { binary: true });
    }
    zip.generateAsync({ type: 'blob' }).then((content) => {
      const link = document.createElement('a');
      link.href = URL.createObjectURL(content);
      link.download = sanitizeName(document.getElementById('zipName').value || 'images.zip');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(link.href);
    });
  }

  function naturalSort(a, b) {
    const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
    return collator.compare(a, b);
  }
  function shortenString(str) {
    const max = 50;
    if (str.length <= max) return str;
    return str.slice(0, 24) + '...' + str.slice(-23);
  }
  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }
  function sanitizeName(s) {
    return String(s).replace(/[\/\\?%*:|"<>]/g, '_');
  }
</script>
